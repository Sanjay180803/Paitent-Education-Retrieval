name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    # Real Qdrant (in-memory), BM25, RRF, cache (fakeredis) and API;
    # embedder and cross-encoder replaced by deterministic stand-ins.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          grep -v sentence-transformers requirements.txt > /tmp/req.txt
          pip install -r /tmp/req.txt pytest httpx
      - run: pytest tests -v

  models:
    # Same suite plus tests that load the real embedding and cross-encoder
    # models, including the known insipidus/mellitus limitation (xfail).
    runs-on: ubuntu-latest
    env:
      RUN_MODEL_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt pytest httpx
      - run: pytest tests/test_models.py -v -rxX
